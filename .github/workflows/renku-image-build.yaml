name: build image

on:
  push:
    branches:
      - master

jobs:
  build-image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/renku-image
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
      - name: Format image tags for Renku build action
        id: image-tags
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          printf 'tags=%s\n' "${IMAGE_TAGS//$'\n'/,}" >> "$GITHUB_OUTPUT"
      - name: Build RenkuLab image
        uses: swissdatasciencecenter/renku-frontend-buildpacks/actions/build-image@main
        with:
          tags: ${{ steps.image-tags.outputs.tags }}
          frontend: jupyterlab
