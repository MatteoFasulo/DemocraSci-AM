[project]
name = "democrasci-am"
version = "0.1.0"
description = "Retrieval and stance detection for parliamentary speech and bill data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "click>=8.1.8",
    "chromadb>=1.0.0",
    "huggingface-hub>=1.0.0",
    "llm>=0.32",
    "neo4j>=6.1.0",
    "numpy>=2.0",
    "openai>=1.60",
    "pandas>=3.0.1",
    "pyarrow>=23.0.1",
    "pydantic>=2.0",
    "requests>=2.32",
    "safetensors>=0.5",
    "torch>=2.4",
    "torchvision",
    "sentence-transformers>=5.3.0",
    "streamlit>=1.40",
    "tqdm>=4.67.3",
    "transformers>=4.45",
    "bertopic>=0.17.4",
    "datasets>=3.0",
    "fastapi>=0.115",
    "matplotlib>=3.10.8",
    "scikit-learn>=1.5",
    "uvicorn>=0.34",
]

[tool.poetry]
package-mode = false

[tool.ruff]
line-length = 119
